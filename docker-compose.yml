version: '3.9'

services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - frontend
      - backend

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    expose:
      - '3001'
    env_file:
      - ./apps/backend/.env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    expose:
      - '80'
