# Config nginx w image frontendu (statyki SPA z Vite).
server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: głębokie linki (react-router) muszą zwracać index.html, nie 404
  location / {
    try_files $uri $uri/ /index.html;
  }

  # zasoby z hashem w nazwie (vite) można cache'ować agresywnie
  location /assets/ {
    add_header Cache-Control 'public, max-age=31536000, immutable';
  }

  location = /index.html {
    add_header Cache-Control 'no-cache';
  }
}
