# Production vhost for the HOST nginx (Ubuntu): copy to
# /etc/nginx/sites-available/, symlink into sites-enabled, then run
# `sudo certbot --nginx -d co-zagrac.pl`. Certbot appends the HTTPS server
# block to the deployed file - this repo copy is the pre-certbot base.
server {
    listen 80;
    listen [::]:80;

    server_name co-zagrac.pl;

    client_max_body_size 10m;

    # static SPA served by the frontend container (nginx, see nginx/frontend.conf)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # backend sets server.timeout = 70s (e.g. synchronous profile embeddings)
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
