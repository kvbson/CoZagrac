events {}

http {

  server {
    listen 80;

    # Aktywne po wystawieniu certyfikatu (HTTPS na VPSie — certbot):
    # listen 443 ssl;
    # ssl_certificate /etc/nginx/certs/co-zagrac.pl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/co-zagrac.pl/privkey.pem;

    client_max_body_size 10m;

    # healthcheck kontenera proxego — bez wychodzenia na backend/frontend
    location = /nginx-health {
      default_type text/plain;
      return 200 'ok';
    }

    location / {
      proxy_pass http://frontend:80;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
      proxy_pass http://backend:3001;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # backend ustawia server.timeout = 70s (np. synchroniczne budowanie profilu)
      proxy_read_timeout 75s;
      proxy_send_timeout 75s;
    }

  }
}
